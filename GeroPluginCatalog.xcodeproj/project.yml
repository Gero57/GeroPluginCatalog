name: GeroPluginCatalog
options:
  bundleIdPrefix: it.gero
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: it.gero.GeroPluginCatalog
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Gero Plugin Catalog
targets:
  GeroPluginCatalog:
    type: application
    platform: macOS
    sources:
      - GeroPluginCatalog
    settings:
      base:
        PRODUCT_NAME: Gero Plugin Catalog
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_ALLOWED: NO
